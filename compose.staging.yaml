name: health-agent-staging

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:${POSTGRES_PORT:-56432}:5432"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-health_agent_staging}
      POSTGRES_USER: ${POSTGRES_USER:-health_agent_staging}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-health_agent_staging_1}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - staging_health_postgres:/var/lib/postgresql
      - ./docker/postgres/staging-init:/docker-entrypoint-initdb.d:ro

  metabase:
    image: metabase/metabase:v0.63.13
    restart: unless-stopped
    ports: ["127.0.0.1:${STAGING_METABASE_PORT:-54000}:3000"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres
      MB_DB_PORT: 5432
      MB_DB_DBNAME: metabase_staging
      MB_DB_USER: ${POSTGRES_USER:-health_agent_staging}
      MB_DB_PASS: ${POSTGRES_PASSWORD:-health_agent_staging_1}
    volumes: ["staging_health_metabase:/metabase-data"]

volumes:
  staging_health_postgres: {}
  staging_health_metabase: {}
